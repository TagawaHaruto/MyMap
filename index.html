<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MyMap</title>
  <meta name="theme-color" content="#264af4">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@digital-go-jp/design-tokens@2.0.1/dist/tokens.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <h1>MyMap</h1>
    <button id="weather" class="weather" type="button" aria-live="polite">天気を確認中…</button>
  </header>
  <p id="update-msg" class="notice" hidden></p>

  <section class="filters" aria-label="絞り込み">
    <div class="row"><span class="label">移動</span><div id="f-mode" class="chips"></div></div>
    <div class="row"><span class="label">時間</span><div id="f-time" class="chips"></div></div>
    <div class="row"><span class="label">都県</span><div id="f-pref" class="chips"></div></div>
    <div class="row"><span class="label">種類</span><div id="f-genre" class="chips"></div></div>
  </section>

  <section id="recommend" class="recommend" aria-label="今週末のおすすめ"></section>

  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="spots">スポット</button>
    <button role="tab" data-tab="events">イベント</button>
    <button role="tab" data-tab="touring">ツーリング</button>
    <button role="tab" data-tab="settings">設定</button>
  </nav>

  <main id="view"></main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="lib.js"></script>
  <script src="app.js"></script>
</body>
</html>
