# 定期実行はしない。アプリ（または Actions タブ）からの依頼と、main への変更のときだけ動く。
# 公開するサイトは「main のアプリ＋最新のデータ」を組み立て、gh-pages ブランチに 1 コミットだけで上書きする
# （約10万件のデータを main の履歴に積まないため。Pages の Source は gh-pages / root）。
name: collect
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Restore previous data from gh-pages
        run: |
          if git fetch --depth=1 origin gh-pages 2>/dev/null; then
            mkdir -p prev && git archive FETCH_HEAD data | tar -x -C prev
            # 自動生成のデータだけ前回分を使う（手作業のデータは main のもの）
            for f in events.json pois.json status.json osm_spots.json; do
              if [ -f "prev/data/$f" ]; then cp "prev/data/$f" "data/$f"; fi
            done
            if [ -d prev/data/cells ]; then rm -rf data/cells && cp -r prev/data/cells data/cells; fi
          else
            echo "gh-pages がまだないので、空のデータから始めます"
          fi
      - name: Test
        run: python3 -m unittest discover -s collector -v
      - name: Collect
        if: github.event_name == 'workflow_dispatch'
        run: python3 collector/collect.py
      - name: Publish to gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir site
          cp -r index.html app.js lib.js style.css sw.js manifest.webmanifest icon.svg icons config.json data site/
          touch site/.nojekyll
          cd site
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "site: $(date -u +%Y-%m-%dT%H:%MZ) (${GITHUB_EVENT_NAME})"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
